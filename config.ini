[Settings]
# Enable debug mode (True/False)
debug_mode = False

# Voice recognition settings
voice_enabled = True
language = en-US
voice_timeout = 10

# Command matching
similarity_threshold = 85

[Battery]
# Battery alert threshold (percentage)
alert_threshold = 20

# Check intervals (seconds)
battery_check_interval = 30
charger_check_interval = 5

[System]
# Platform settings
enable_system_commands = True
